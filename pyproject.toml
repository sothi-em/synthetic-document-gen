[project]
name = "document-gen"
version = "0.1.0"
description = "Generate synthetic companies and data-driven documents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faker>=40.11.1",
    "json-repair>=0.58.7",
    "matplotlib>=3.8.0",
    "ollama>=0.6.1",
    "openai>=1.0.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.2",
    "pydantic>=2.12.5",
    "weasyprint>=62.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.67.3",
    "tinydb>=4.8",
]

[project.optional-dependencies]
embed = [
    "chromadb>=1.5.9",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
document-gen = "document_gen.cli:main"

[dependency-groups]
dev = [
    "black>=24.0.0",
    "httpx>=0.27",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Coverage target is the models package (see AGENTS.md); pipeline/ollama/
# labels require a live Ollama server and are not unit-tested.
source = ["document_gen/models"]

[tool.coverage.report]
fail_under = 80
